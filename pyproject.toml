[project]
name = "boardgames"
version = "0.1.0"
description = "Board game night in the browser: one server, one room, ten games with bots"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dmytro Moroz" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "rich>=15.0.0",
    "typer>=0.28.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
bg = "boardgames:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The platform plus one top-level package per game (see CLAUDE.md).
module-name = [
    "boardgames",
    "avenue",
    "codenames",
    "karak",
    "lostcities",
    "pandemic",
    "phase10",
    "skyjo",
    "skyteam",
    "toybattle",
    "ttr",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
]
# Reinforcement learning for the Karak and Skyjo bots. Playing never needs it: `uv sync --group train`.
train = [
    "gymnasium>=1.4.0",
    "matplotlib>=3.11.2",
    "pyyaml>=6.0.3",
    "tensorboard>=2.21.0",
    "torch>=2.15.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tmp", "shots", "scripts/pandemic/mapsrc"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"] # browser checks embed JavaScript snippets
"tests/skyjo/test_rl.py" = ["E402"] # skipped without the train group, before torch is imported
# Sky Team was written with a smaller rule set; keep it as it was.
"src/skyteam/**" = ["E501", "B905", "UP", "SIM", "RUF"]
"tests/skyteam/**" = ["E501", "B905", "UP", "SIM", "RUF"]
"scripts/skyteam/**" = ["E501", "B905", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib: every game has its own tests/<game>/test_engine.py, so module names must not collide.
addopts = "-q --import-mode=importlib"
# Shared helper modules of these suites (`from pandemic_helpers import ...`).
pythonpath = ["tests/pandemic", "tests/phase10"]
