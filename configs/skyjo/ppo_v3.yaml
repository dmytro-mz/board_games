# Experiment 3: residual policy on top of the `expert` heuristic (obs v3 prior block),
# trained mostly against `expert` on full games with a win bonus.
name: ppo_v3
seed: 0
device: cpu
torch_threads: 4
snapshot_every_updates: 10
save_every_updates: 25

env:
  n_players: 2
  episode: game
  reward: relative
  reward_scale: 10.0
  win_bonus: 1.0
  opponents:
    expert: 0.8
    self: 0.2
  max_snapshots: 20
  obs_version: 3

ppo:
  total_timesteps: 30_000_000
  num_envs: 160
  num_steps: 128
  num_workers: 10
  learning_rate: 2.0e-4
  anneal_lr: true
  gamma: 0.997
  gae_lambda: 0.95
  num_minibatches: 8
  update_epochs: 4
  clip_coef: 0.2
  ent_coef: 0.002
  ent_coef_final: 0.0005
  vf_coef: 0.5
  max_grad_norm: 0.5
  hidden: [512, 256]
  residual_prior: true
  prior_scale: 20.0
  critic_warmup_updates: 20

eval:
  every_updates: 20
  games: 600
  opponents: [expert, ev]
  workers: 10
  best_metric_opponent: expert
